services:
  app:
    build: .
    image: store-manager:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    # Plain HTTP on loopback only; the host's existing TLS reverse proxy forwards to it.
    # If the proxy itself runs in Docker, remove `ports` and attach this service to the
    # proxy's network instead (see README).
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
