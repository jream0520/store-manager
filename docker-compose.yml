services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    expose:
      - "3000"

  # Terminates HTTPS (required for iOS camera + PWA install). Remove this service
  # and point your existing reverse proxy at app:3000 if you already have one.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
